version: 2

builds:
  - binary: flagsmith
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -X github.com/Flagsmith/flagsmith-cli/internal/version.Version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "flagsmith_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

docker_digest:
  name_template: digests.txt

dockers_v2:
  - images:
      - ghcr.io/flagsmith/flagsmith-cli
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      # Beta releases still take :latest — nothing stabler is published yet.
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      # Links the ghcr package to this repo.
      org.opencontainers.image.source: https://github.com/Flagsmith/flagsmith-cli
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

# changelog handled by release-please.
changelog:
  disable: true

release:
  mode: keep-existing
  prerelease: auto
