# Hugo config for the generated command reference at
# https://flagsmith.github.io/flagsmith-cli/
#
# The whole of content/ is generated by `go run ./cmd/docgen` and is not
# committed; see website/README.md.
baseURL: https://flagsmith.github.io/flagsmith-cli/
title: Flagsmith CLI
locale: en-gb

module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true
# Generated pages have no git history of their own, so there is no
# "last modified" worth showing.
enableGitInfo: false

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      # Required by Hextra's shortcodes, which emit HTML.
      unsafe: true

menu:
  main:
    # Installing is documented in the README and on docs.flagsmith.com. Link to
    # one of them rather than keeping a third copy in step.
    - name: Install
      url: https://github.com/Flagsmith/flagsmith-cli#install
      weight: 1
    - name: Guides
      url: https://docs.flagsmith.com/integrating-with-flagsmith/CLI
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: https://github.com/Flagsmith/flagsmith-cli
      params:
        icon: github

params:
  version: "v2.0.0" # x-release-please-version
  description: The Flagsmith command-line interface — manage flags, segments and environments from your terminal.
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: false
    displayPoweredBy: false
  # The reference is generated, so "edit this page" would point at a file that
  # does not exist in the repository.
  editURL:
    enable: false
  page:
    width: normal
  # Every page is a command, so the sidebar is the command tree and should be
  # visible from the home page down.
  sidebar:
    displayTitle: false
